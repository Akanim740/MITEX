<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | MITEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fbbf24' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#070b14" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MITEX" />
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-page="login">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="logo" href="/index.html">MIT<span>EX</span></a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage your account and enquiries.</p>

      <form id="loginForm">
        <label>Email address
          <input type="email" id="lEmail" placeholder="you@example.com" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="lPass" placeholder="Your password" required autocomplete="current-password" />
        </label>
        <p id="formError" class="error hidden"></p>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="divider"><span>or</span></div>
      <button type="button" id="biometricBtn" class="btn btn-ghost btn-full hidden">
        Use fingerprint or face ID
      </button>
      <p id="biometricMsg" class="muted hint"></p>

      <p class="switch-line"><a href="/reset-password.html">Forgot your password?</a></p>
      <p class="switch-line">New to MITEX? <a href="/register.html">Create an account</a></p>
      <p class="switch-line">Looking to buy? <a href="/marketplace.html">Browse the marketplace</a></p>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
