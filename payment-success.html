<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status | MITEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fbbf24' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#070b14" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MITEX" />
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="print.css" />
</head>
<body data-page="payment-success">
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center;align-items:center;">
      <a class="logo" href="/index.html">MIT<span>EX</span></a>
      <div id="statusIcon" style="font-size:3rem;">⏳</div>
      <h1 id="statusTitle">Confirming your payment...</h1>
      <p class="sub" id="statusText">This will only take a moment.</p>

      <div id="receiptWrap" class="receipt-print hidden" style="display:none;text-align:left;width:100%;">
        <div class="receipt-box">
          <h2 style="margin:0 0 4px;">MITEX Receipt</h2>
          <p class="muted" id="receiptRef" style="margin:0 0 14px;"></p>
          <table>
            <tbody id="receiptRows"></tbody>
            <tr class="receipt-total"><td>Total Paid</td><td id="receiptTotal"></td></tr>
          </table>
          <p class="muted" style="margin-top:14px;">Questions? WhatsApp +234 701 163 3770</p>
        </div>
      </div>

      <div id="statusActions" class="hidden no-print" style="display:flex;flex-direction:column;gap:10px;width:100%;">
        <a href="/account.html#orders-panel" class="btn btn-primary btn-full">View My Orders</a>
        <button type="button" class="btn btn-ghost btn-full no-print" id="printBtn" style="display:none;">Print Receipt</button>
        <a href="/marketplace.html" class="btn btn-ghost btn-full no-print">Back to Marketplace</a>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
