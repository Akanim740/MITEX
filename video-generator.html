<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MITEX AI Video Generator | Short Clips for Content Creation</title>
  <meta name="description" content="Turn a short brief into an animated clip for social and content creation with MITEX AI. Pick a format, write your scenes, download the result.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <style>
    .videogen{display:grid;gap:2rem;max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
    .hero{display:grid;gap:1rem;text-align:center}
    .hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05}
    .panel{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:1.5rem;display:grid;gap:1rem;box-shadow:var(--shadow)}
    .grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    textarea{min-height:140px;padding:1rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.4);color:var(--text);font-family:inherit}
    input,select{padding:.75rem 1rem;border-radius:.75rem;border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.4);color:var(--text);font-family:inherit}
    label{display:grid;gap:.35rem;font-size:.9rem;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.25rem;border-radius:.75rem;border:0;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f172a;font-weight:700;cursor:pointer}
    .btn.secondary{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .scene{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.75rem;padding:.75rem 1rem;display:grid;gap:.25rem}
    .scene b{font-weight:600}
    .scene span{color:var(--muted);font-size:.85rem}
    .badge{padding:.25rem .5rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-size:.85rem;width:fit-content}
    .warn{border-left:3px solid #fbbf24;padding:.5rem .75rem;background:rgba(251,191,36,.08);border-radius:.35rem;font-size:.9rem}
    .err{border-left:3px solid #ef4444;padding:.5rem .75rem;background:rgba(239,68,68,.1);border-radius:.35rem;font-size:.9rem}
    .muted{color:var(--muted)}
    .previewWrap{display:grid;gap:1rem;justify-items:center}
    .previewWrap img{max-width:100%;border-radius:.75rem;border:1px solid rgba(255,255,255,.1);background:#000}
    .actions{display:flex;gap:.75rem;flex-wrap:wrap}
    .meta{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .spinner{display:inline-block;width:1rem;height:1rem;border:2px solid rgba(15,23,42,.3);border-top-color:#0f172a;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container topbar">
      <a href="index.html" class="logo">
        <img src="assets/logo.svg" alt="MITEX logo">
        <span>MITEX</span>
      </a>
      <nav class="nav-links" id="navLinks"></nav>
      <button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="auth-controls" id="authControls"></div>
    </div>
  </header>

  <main class="videogen">
    <section class="hero">
      <h1>AI <span style="color:#fbbf24">Video Generator</span></h1>
      <p class="muted">Write a short brief. MITEX AI drafts the scenes, then renders an animated clip you can download for your content.</p>
      <div id="loginNote" class="muted" style="display:none">Sign in to generate videos.</div>
    </section>

    <section class="panel" id="formPanel" style="display:none">
      <label for="vBrief">
        Brief
        <textarea id="vBrief" placeholder="What should the video say? e.g. Launch of our new portfolio site. Built with MITEX. Clean, fast, ready to edit."></textarea>
      </label>

      <div class="grid">
        <label for="vAspect">
          Format
          <select id="vAspect">
            <option value="landscape">Landscape (640×360)</option>
            <option value="square">Square (640×640)</option>
            <option value="portrait">Portrait (360×640)</option>
          </select>
        </label>

        <label for="vDuration">
          Length
          <select id="vDuration">
            <option value="6">About 6 seconds</option>
            <option value="10" selected>About 10 seconds</option>
            <option value="15">About 15 seconds</option>
            <option value="20">About 20 seconds</option>
          </select>
        </label>

        <label for="vFade">
          Transitions
          <select id="vFade">
            <option value="4" selected>Crossfade</option>
            <option value="0">Cut</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button class="btn" id="genBtn">Generate video</button>
        <button class="btn secondary" id="againBtn" style="display:none">Regenerate</button>
      </div>

      <div id="formMsg"></div>
    </section>

    <section class="panel" id="resultPanel" style="display:none">
      <div class="meta">
        <span class="badge" id="rModel"></span>
        <span class="badge" id="rDims"></span>
        <span class="muted" id="rMeta"></span>
      </div>

      <div class="previewWrap">
        <img id="rPreview" alt="Generated video preview">
        <div class="actions">
          <a class="btn" id="dlBtn" download>Download GIF</a>
        </div>
      </div>

      <div id="rWarnings"></div>

      <div>
        <h3>Scenes</h3>
        <div id="rScenes" style="display:grid;gap:.75rem"></div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="video-generator.js"></script>
</body>
</html>
