<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Website Marketplace | MITEX</title>
  <meta name="description" content="Browse and buy premium, ready-to-launch websites from MITEX. Secure checkout with Paystack." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fbbf24' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#070b14" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MITEX" />
  <script src="/pwa.js" defer></script>
  <script src="/analytics.js" defer></script>
  <script src="/cookie-consent.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    .market-main { width: min(1100px, 94%); margin-inline: auto; padding: 46px 0 90px; }
    .market-head { margin-bottom: 34px; }
    .market-head h1 { font-family: "Sora", sans-serif; font-size: clamp(1.7rem, 4vw, 2.4rem); }
    .market-head p { color: var(--muted); max-width: 560px; }
    .search-wrap { position: relative; margin-top: 24px; max-width: 540px; }
    .search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .search-wrap input { width: 100%; padding: 14px 18px 14px 44px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color .25s ease, box-shadow .25s ease; }
    .search-wrap input:focus { border-color: rgba(251,191,36,.6); box-shadow: 0 0 0 4px rgba(251,191,36,.12); }
    .result-count { margin-top: 10px; font-size: .85rem; }
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
    .listing-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px; transition: transform .25s ease, border-color .25s ease; }
    .listing-card:hover { transform: translateY(-5px); border-color: rgba(251,191,36,.45); }
    .listing-card h3 { font-family: "Sora", sans-serif; font-size: 1.12rem; }
    .listing-card p { color: var(--muted); font-size: .92rem; flex-grow: 1; }
    .price { font-family: "Sora", sans-serif; font-size: 1.45rem; font-weight: 800; color: var(--gold); }
    .tech-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .handled-by { font-size: .85rem; color: var(--muted); padding-top: 10px; border-top: 1px dashed var(--card-border); }
    .handled-by strong { color: var(--text); }
    .handled-by a { color: #25d366; text-decoration: none; font-weight: 600; }
    .sold-overlay { position: relative; opacity: .55; pointer-events: none; }
    .sold-tag { position: absolute; top: 16px; right: 16px; }
    .empty-market { padding: 60px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; border: 1px dashed var(--card-border); border-radius: 18px; }
    .skel { background: linear-gradient(90deg, var(--card) 25%, rgba(255,255,255,.05) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 10px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 30px; }
    .pager button { min-width: 38px; min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); cursor: pointer; font-family: inherit; }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager button.active { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.5); color: #fbbf24; font-weight: 700; }
    .market-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .stat-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--card-border); border-radius: 999px; padding: 8px 16px; font-size: .85rem; color: var(--muted); }
    .stat-chip strong { color: var(--gold); font-family: "Sora", sans-serif; font-size: .95rem; }
    .sold-ticker-wrap { display: flex; align-items: center; gap: 12px; margin-top: 16px; overflow: hidden; }
    .ticker-label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); white-space: nowrap; }
    .sold-ticker { display: flex; gap: 26px; list-style: none; margin: 0; padding: 0; animation: ticker-scroll 38s linear infinite; white-space: nowrap; }
    .sold-ticker li { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
    .ticker-dot { width: 7px; height: 7px; border-radius: 50%; background: #25d366; flex: none; }
    @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .sold-ticker-wrap:hover .sold-ticker { animation-play-state: paused; }
    .btn-share { margin-top: 6px; align-self: flex-start; background: transparent; border: 1px solid var(--card-border); color: var(--muted); border-radius: 999px; padding: 6px 16px; font-size: .82rem; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: border-color .2s ease, color .2s ease; }
    .btn-share:hover { border-color: rgba(251,191,36,.5); color: #fbbf24; }
    @media (max-width: 640px) { .sold-ticker-wrap { flex-direction: column; align-items: flex-start; gap: 6px; } }
  </style>
</head>
<body data-page="marketplace">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="/index.html">MIT<span>EX</span></a>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="lang-switcher" id="langSwitcher" style="position:relative;">
          <button type="button" id="langBtn" style="background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:0.85rem;display:flex;align-items:center;gap:6px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.7;"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="langLabel">EN</span>
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="langDropdown" style="display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:6px;min-width:160px;max-height:280px;overflow-y:auto;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);"></div>
        </div>
        <div id="navAuthArea"></div>
      </div>
    </div>
  </header>

  <main class="market-main">
    <div class="market-head">
      <h1 data-i18n="market_title">Premium Website <span style="color:#fbbf24;">Marketplace</span></h1>
      <p data-i18n="market_sub">Ready-to-launch websites, hand-built by MITEX. Pay securely with Paystack and take ownership fast.</p>
      <div id="marketStats"></div>
      <div class="sold-ticker-wrap" style="display:none;">
        <span class="ticker-label">Recently sold</span>
        <ul class="sold-ticker" id="soldTicker"></ul>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="search" id="marketSearch" data-i18n-placeholder="market_search" placeholder="Search websites - e.g. e-commerce, portfolio, school, blog..." autocomplete="off" />
      </div>
      <p class="result-count muted" id="resultCount"></p>
    </div>

    <div class="listing-grid" id="listingsGrid"></div>
    <div class="pager" id="pager" style="display:none;"></div>
  </main>

  <script src="/currencies.js"></script>
  <script src="/i18n.js"></script>
  <script src="auth.js"></script>
</body>
</html>
