<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | MITEX</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fbbf24' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-page="demo-checkout">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="logo" href="/index.html">MIT<span>EX</span></a>
      <h1>Checkout</h1>
      <p class="sub">Review your order before paying.</p>

      <div id="orderBox">
        <div class="meta-list" style="border-top:none;padding-top:0;">
          <div><span>Item</span><b id="oTitle">Loading...</b></div>
          <div><span>Reference</span><b id="oRef">-</b></div>
          <div><span>Amount</span><b id="oAmount" style="color:#fbbf24;">-</b></div>
        </div>
        <p id="checkoutError" class="error hidden"></p>
        <button type="button" id="payBtn" class="btn btn-primary btn-full" style="margin-top:16px;" disabled>Pay Now</button>
      </div>

      <div id="paidBox" class="hidden">
        <p class="success-text">This order has already been paid.</p>
        <a href="/account.html#orders-panel" class="btn btn-primary btn-full">View My Orders</a>
      </div>

      <p class="switch-line muted"><a href="/marketplace.html">Back to marketplace</a></p>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
