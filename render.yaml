services:
  - type: web
    name: mitex
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the deployed site (Render fills this in automatically)
      - key: APP_URL
        value: https://mitex.onrender.com
      - key: CORS_ORIGIN
        value: https://mitex.onrender.com
      # ===== Node version =====
      - key: NODE_VERSION
        value: 20
      # ===== Database (Supabase Postgres) =====
      - key: DB_CLIENT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Seed admin + 23 listings on first boot (safe to leave on - idempotent).
      # ADMIN_PASSWORD is REQUIRED in production or seeding aborts with a clear error.
      - key: SEED_ON_BOOT
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: MITEX Admin
      # ===== Auth secrets =====
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "7"
      # ===== Biometric login =====
      # Must match your site's exact domain. Change to your custom domain
      # after connecting it, e.g. mitex.store
      - key: WEBAUTHN_RP_ID
        value: mitex.onrender.com
      # ===== Email (SMTP) - required for OTP login, notifications, receipts =====
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ===== Push notifications (optional) =====
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ===== Paystack =====
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_BASE_URL
        value: https://api.paystack.co